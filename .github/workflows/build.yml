name: Build IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: true
        default: "web2ipa"
      bundle_id:
        description: "Bundle ID (например com.example.myapp)"
        required: true
        default: "com.web2.ipa"
      url:
        description: "Ссылка на сайт (пусто = использовать папку site/ из репозитория)"
        required: false
        default: ""
      theme_color:
        description: "Акцентный цвет (HEX, например #0A84FF)"
        required: false
        default: "#0A84FF"
      appearance:
        description: "Тема: system / light / dark"
        required: false
        type: choice
        options: [system, light, dark]
        default: system
      show_toolbar:
        description: "Показывать нижнюю панель навигации"
        required: false
        type: boolean
        default: true
  # Сборка из редактора: он обновляет site/index.html, а потом build.json
  push:
    branches: [main]
    paths: [build.json]

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve settings
        env:
          EVENT: ${{ github.event_name }}
          I_NAME: ${{ inputs.app_name }}
          I_BUNDLE: ${{ inputs.bundle_id }}
          I_URL: ${{ inputs.url }}
          I_THEME: ${{ inputs.theme_color }}
          I_AP: ${{ inputs.appearance }}
          I_TB: ${{ inputs.show_toolbar }}
        run: |
          if [ "$EVENT" = "push" ]; then
            J=build.json
            NAME=$(jq -r '.app_name ' $J)
            BUNDLE=$(jq -r '.bundle_id // "com.web2.ipa"' $J)
            URL=$(jq -r '.url // ""' $J)
            THEME=$(jq -r '.theme_color // "#0A84FF"' $J)
            AP=$(jq -r '.appearance // "system"' $J)
            TB=$(jq -r 'if has("show_toolbar") then .show_toolbar else true end' $J)
          else
            NAME="$I_NAME"; BUNDLE="$I_BUNDLE"; URL="$I_URL"
            THEME="$I_THEME"; AP="$I_AP"; TB="$I_TB"
          fi
          NAME=$(printf '%s' "$NAME" | tr -d '\r\n')
          case "$BUNDLE" in ""|*[!A-Za-z0-9.-]*) BUNDLE=com.web2.ipa;; esac
          case "$THEME" in \#[0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f]) ;; *) THEME="#0A84FF";; esac
          case "$AP" in system|light|dark) ;; *) AP=system;; esac
          {
            echo "APP_NAME=$NAME"
            echo "BUNDLE_ID=$BUNDLE"
            echo "SITE_URL=$URL"
            echo "THEME=$THEME"
            echo "APPEARANCE=$AP"
            echo "TOOLBAR=$TB"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write config
        run: |
          jq -n --arg url "$SITE_URL" --arg theme "$THEME" --arg ap "$APPEARANCE" --arg tb "$TOOLBAR" \
            '{url: $url, themeColor: $theme, appearance: $ap, showToolbar: ($tb == "true")}' > App/Config.json
          mkdir -p site
          if [ -z "$(ls -A site 2>/dev/null)" ]; then
            echo "<!DOCTYPE html><html><body></body></html>" > site/index.html
          fi

      - name: Prepare icon
        run: |
          if [ -f icon.png ]; then
            sips -z 1024 1024 icon.png --out App/Assets.xcassets/AppIcon.appiconset/icon.png
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project WebApp.xcodeproj \
            -scheme WebApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app.ipa \
            --title "$APP_NAME (build ${{ github.run_number }})" \
            --notes "Готовый IPA. Открой его в LiveContainer."
